aid: erasca
name: Erasca
description: >-
  Erasca is a clinical-stage precision oncology company (NASDAQ: ERAS)
  headquartered in San Diego, California, whose name is its mission: to erase
  cancer. The company is singularly focused on discovering, developing, and
  commercializing therapies for RAS- and MAPK pathway-driven cancers. RAS is the
  most frequently mutated oncogene and the MAPK pathway one of the most
  frequently altered signaling pathways in cancer, together accounting for
  roughly five million newly diagnosed patients globally each year. Erasca
  pursues three complementary therapeutic strategies intended to comprehensively
  shut down the RAS/MAPK pathway by targeting multiple nodes and cooperative
  mechanisms in parallel. This API Evangelist profile was surfaced as an a16z
  portfolio-linked lead; as a therapeutics company Erasca publishes a corporate
  and investor web presence rather than a developer API surface, so this record
  captures verified company identity, legal, and domain-security signals only.
